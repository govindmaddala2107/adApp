<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#0c1018">
    <title>Calculator</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #0c1018;
        color: #f5f7fb;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(ellipse at 50% 0%, rgb(64 81 130 / 22%), transparent 48%),
          #0c1018;
      }

      .calculator {
        width: min(100%, 368px);
        padding: 24px;
        border: 1px solid rgb(255 255 255 / 8%);
        border-radius: 28px;
        background: linear-gradient(155deg, #1a2030, #141923 54%, #11151e);
        box-shadow: 0 28px 80px rgb(0 0 0 / 42%), inset 0 1px 0 rgb(255 255 255 / 5%);
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 30px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 11px;
      }

      .brand-mark {
        display: grid;
        width: 36px;
        height: 36px;
        place-items: center;
        border: 1px solid rgb(151 170 255 / 25%);
        border-radius: 12px;
        background: rgb(117 139 255 / 12%);
        color: #aebaff;
      }

      .brand-mark svg {
        width: 19px;
        height: 19px;
      }

      .brand-name {
        font-size: 14px;
        font-weight: 650;
        letter-spacing: 0.01em;
      }

      .brand-caption {
        margin-top: 3px;
        color: #7f899e;
        font-size: 11px;
      }

      .keyboard-hint {
        padding: 7px 9px;
        border: 1px solid rgb(255 255 255 / 8%);
        border-radius: 9px;
        color: #778196;
        font-size: 10px;
        letter-spacing: 0.04em;
      }

      .display {
        min-height: 120px;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        justify-content: flex-end;
        overflow: hidden;
        padding: 0 3px 20px;
        text-align: right;
      }

      .expression {
        width: 100%;
        min-height: 22px;
        overflow: hidden;
        color: #8490a8;
        font-size: 14px;
        white-space: nowrap;
        text-overflow: ellipsis;
      }

      .result {
        width: 100%;
        overflow: hidden;
        color: #f6f7fc;
        font-size: clamp(38px, 12vw, 54px);
        font-weight: 350;
        letter-spacing: -0.055em;
        line-height: 1.18;
        white-space: nowrap;
        text-overflow: clip;
        font-variant-numeric: tabular-nums;
      }

      .result.is-long {
        font-size: 36px;
      }

      .keys {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 10px;
      }

      button {
        min-width: 0;
        height: 62px;
        border: 1px solid transparent;
        border-radius: 17px;
        background: #252c3b;
        color: #e8ebf4;
        font: inherit;
        font-size: 20px;
        font-weight: 500;
        cursor: pointer;
        transition: background 140ms ease, border-color 140ms ease, transform 140ms ease;
        -webkit-tap-highlight-color: transparent;
      }

      button:hover {
        border-color: rgb(255 255 255 / 8%);
        background: #30394b;
      }

      button:active {
        transform: scale(0.96);
      }

      button:focus-visible {
        outline: 2px solid #a7b3ff;
        outline-offset: 3px;
      }

      .key-function {
        background: #303747;
        color: #bac3d5;
        font-size: 17px;
      }

      .key-operator {
        background: #2d3548;
        color: #aebaff;
        font-size: 22px;
      }

      .key-operator.is-selected {
        background: #5968bf;
        color: white;
      }

      .key-equals {
        background: linear-gradient(145deg, #8291ff, #6675e8);
        color: white;
        font-size: 25px;
        box-shadow: 0 6px 18px rgb(102 117 232 / 22%);
      }

      .key-equals:hover {
        background: linear-gradient(145deg, #929fff, #7583f2);
      }

      .key-zero {
        grid-column: span 2;
      }

      .footer {
        margin: 18px 0 0;
        color: #606a7e;
        font-size: 10px;
        letter-spacing: 0.09em;
        text-align: center;
        text-transform: uppercase;
      }

      @media (max-width: 420px) {
        body {
          padding: 16px;
        }

        .calculator {
          padding: 20px;
          border-radius: 25px;
        }

        .topbar {
          margin-bottom: 22px;
        }

        button {
          height: 58px;
          border-radius: 15px;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          transition-duration: 0.01ms !important;
        }
      }
    </style>
  </head>
  <body>
    <main class="calculator" aria-label="Calculator">
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none">
              <rect x="5" y="3" width="14" height="18" rx="3" stroke="currentColor" stroke-width="1.6"/>
              <path d="M8 7h8M8.5 12h.01M12 12h.01M15.5 12h.01M8.5 16h.01M12 16h.01M15.5 16h.01" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/>
            </svg>
          </span>
          <div>
            <div class="brand-name">Calculator</div>
            <div class="brand-caption">Simple &amp; precise</div>
          </div>
        </div>
        <span class="keyboard-hint" aria-hidden="true">KEYBOARD READY</span>
      </header>

      <section class="display" aria-label="Calculator display">
        <div class="expression" id="expression" aria-hidden="true"></div>
        <output class="result" id="display" aria-live="polite" aria-atomic="true">0</output>
      </section>

      <section class="keys" aria-label="Calculator keys">
        <button class="key-function" type="button" data-action="clear" aria-label="All clear">AC</button>
        <button class="key-function" type="button" data-action="sign" aria-label="Change sign">+/-</button>
        <button class="key-function" type="button" data-action="percent" aria-label="Percent">%</button>
        <button class="key-operator" type="button" data-operator="/" aria-label="Divide">÷</button>

        <button type="button" data-digit="7">7</button>
        <button type="button" data-digit="8">8</button>
        <button type="button" data-digit="9">9</button>
        <button class="key-operator" type="button" data-operator="*" aria-label="Multiply">×</button>

        <button type="button" data-digit="4">4</button>
        <button type="button" data-digit="5">5</button>
        <button type="button" data-digit="6">6</button>
        <button class="key-operator" type="button" data-operator="-" aria-label="Subtract">−</button>

        <button type="button" data-digit="1">1</button>
        <button type="button" data-digit="2">2</button>
        <button type="button" data-digit="3">3</button>
        <button class="key-operator" type="button" data-operator="+" aria-label="Add">+</button>

        <button class="key-function key-zero" type="button" data-digit="0">0</button>
        <button type="button" data-action="decimal" aria-label="Decimal point">.</button>
        <button class="key-equals" type="button" data-action="equals" aria-label="Equals">=</button>
      </section>

      <p class="footer">Your everyday calculations</p>
    </main>

    <script>
      const display = document.querySelector("#display");
      const expression = document.querySelector("#expression");
      const keys = document.querySelector(".keys");

      let currentValue = "0";
      let storedValue = null;
      let pendingOperator = null;
      let waitingForOperand = false;
      let hasError = false;

      function render() {
        display.textContent = currentValue;
        display.classList.toggle("is-long", currentValue.length > 11);
        keys.querySelectorAll("[data-operator]").forEach((button) => {
          button.classList.toggle("is-selected", button.dataset.operator === pendingOperator);
        });
      }

      function formatNumber(value) {
        if (!Number.isFinite(value)) {
          return null;
        }
        const rounded = Number(value.toPrecision(12));
        return Object.is(rounded, -0) ? "0" : String(rounded);
      }

      function calculate(left, right, operator) {
        switch (operator) {
          case "+":
            return left + right;
          case "-":
            return left - right;
          case "*":
            return left * right;
          case "/":
            return right === 0 ? null : left / right;
          default:
            return right;
        }
      }

      function showError() {
        currentValue = "Cannot divide by zero";
        storedValue = null;
        pendingOperator = null;
        waitingForOperand = true;
        hasError = true;
        expression.textContent = "";
        render();
      }

      function inputDigit(digit) {
        if (hasError) {
          clearCalculator();
        }
        if (waitingForOperand) {
          if (!pendingOperator) {
            expression.textContent = "";
          }
          currentValue = digit;
          waitingForOperand = false;
        } else if (currentValue.replace("-", "").length < 15) {
          currentValue = currentValue === "0" ? digit : currentValue + digit;
        }
        render();
      }

      function inputDecimal() {
        if (hasError) {
          clearCalculator();
        }
        if (waitingForOperand) {
          if (!pendingOperator) {
            expression.textContent = "";
          }
          currentValue = "0.";
          waitingForOperand = false;
        } else if (!currentValue.includes(".")) {
          currentValue += ".";
        }
        render();
      }

      function clearCalculator() {
        currentValue = "0";
        storedValue = null;
        pendingOperator = null;
        waitingForOperand = false;
        hasError = false;
        expression.textContent = "";
        render();
      }

      function chooseOperator(operator) {
        if (hasError) {
          clearCalculator();
        }
        const inputValue = Number(currentValue);

        if (pendingOperator && !waitingForOperand) {
          const result = calculate(storedValue, inputValue, pendingOperator);
          const formatted = formatNumber(result);
          if (formatted === null) {
            showError();
            return;
          }
          currentValue = formatted;
          storedValue = Number(formatted);
        } else {
          storedValue = inputValue;
        }

        pendingOperator = operator;
        waitingForOperand = true;
        expression.textContent = `${currentValue} ${operatorSymbol(operator)}`;
        render();
      }

      function performEquals() {
        if (!pendingOperator || waitingForOperand || hasError) {
          return;
        }
        const rightValue = Number(currentValue);
        const operation = pendingOperator;
        const leftValue = storedValue;
        const result = calculate(leftValue, rightValue, operation);
        const formatted = formatNumber(result);

        if (formatted === null) {
          showError();
          return;
        }

        expression.textContent = `${formatNumber(leftValue)} ${operatorSymbol(operation)} ${currentValue} =`;
        currentValue = formatted;
        storedValue = null;
        pendingOperator = null;
        waitingForOperand = true;
        render();
      }

      function operatorSymbol(operator) {
        return { "/": "÷", "*": "×", "-": "−", "+": "+" }[operator];
      }

      function applyAction(action) {
        switch (action) {
          case "clear":
            clearCalculator();
            break;
          case "equals":
            performEquals();
            break;
          case "decimal":
            inputDecimal();
            break;
          case "sign":
            if (!hasError && Number(currentValue) !== 0) {
              currentValue = currentValue.startsWith("-") ? currentValue.slice(1) : `-${currentValue}`;
              render();
            }
            break;
          case "percent":
            if (!hasError) {
              currentValue = formatNumber(Number(currentValue) / 100);
              waitingForOperand = false;
              render();
            }
            break;
          case "backspace":
            if (!hasError && !waitingForOperand) {
              currentValue = currentValue.length > 1
                ? currentValue.slice(0, -1)
                : "0";
              if (currentValue === "-") {
                currentValue = "0";
              }
              render();
            }
            break;
        }
      }

      keys.addEventListener("click", (event) => {
        const button = event.target.closest("button");
        if (!button) {
          return;
        }
        if (button.dataset.digit !== undefined) {
          inputDigit(button.dataset.digit);
        } else if (button.dataset.operator) {
          chooseOperator(button.dataset.operator);
        } else if (button.dataset.action) {
          applyAction(button.dataset.action);
        }
      });

      document.addEventListener("keydown", (event) => {
        if (/^\d$/.test(event.key)) {
          inputDigit(event.key);
        } else if (event.key === "." || event.key === ",") {
          inputDecimal();
        } else if (["+", "-", "*", "/"].includes(event.key)) {
          chooseOperator(event.key);
        } else if (event.key === "Enter" || event.key === "=") {
          event.preventDefault();
          performEquals();
        } else if (event.key === "Backspace") {
          event.preventDefault();
          applyAction("backspace");
        } else if (event.key === "Escape" || event.key === "Delete") {
          clearCalculator();
        } else if (event.key === "%") {
          applyAction("percent");
        }
      });
    </script>
  </body>
</html>
